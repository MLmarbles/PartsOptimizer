services:
  database:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: pcbuilder_user
      POSTGRES_PASSWORD: pcbuilder_password
      POSTGRES_DB: pcbuilder_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://pcbuilder_user:pcbuilder_password@database:5432/pcbuilder_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
